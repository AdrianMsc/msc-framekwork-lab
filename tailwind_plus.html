<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Plus - MSC Direct Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        'msc-blue': '#1C58EE',
                        'msc-red': '#EE3124',
                    },
                    boxShadow: {
                        'premium': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'plus': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .msc-border-bottom { border-bottom: 4px solid #1C58EE; }
        .top-bar { background-color: #f1f5f9; font-size: 12px; }
        header i.fa-solid:not(.fa-magnifying-glass), 
        header i.fa-regular { 
            color: #1C58EE !important; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Top Bar -->
    <div class="top-bar py-1.5 px-6 border-b border-slate-200">
        <div class="max-w-screen-2xl mx-auto flex justify-between items-center text-slate-500 font-bold uppercase tracking-wider">
            <div class="flex gap-8">
                <a href="#" class="hover:text-msc-blue">Solutions</a>
                <a href="#" class="hover:text-msc-blue">Resources</a>
                <a href="#" class="hover:text-msc-blue">Special Offers</a>
                <a href="#" class="hover:text-msc-blue">Catalogs</a>
            </div>
            <div>
                Need help? <span class="text-msc-blue">1-800-645-7270</span>
            </div>
        </div>
    </div>

    <header class="glass-header sticky top-0 z-[100] msc-border-bottom shadow-sm">
        <div class="max-w-screen-2xl mx-auto px-6 h-24 flex items-center justify-between">
            
            <!-- Brand -->
            <div class="flex items-center gap-12">
                <a href="#" class="flex items-center group transition-transform hover:scale-105">
                   <img src="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg" alt="MSC Direct" class="h-12">
                </a>

                <nav class="hidden lg:flex items-center">
                    <button class="flex items-center gap-2 text-sm font-black text-msc-blue uppercase tracking-tighter hover:opacity-80 transition-opacity">
                        Shop All Products
                        <i class="fa-solid fa-chevron-down text-xs mt-0.5 text-msc-blue"></i>
                    </button>
                </nav>
            </div>

            <!-- Search -->
            <div class="flex-1 max-w-2xl px-8">
                <div class="flex items-stretch bg-white border-2 border-slate-200 rounded-lg focus-within:border-msc-blue transition-all overflow-hidden shadow-sm">
                    <input type="text" placeholder="Search by keyword or part number..." class="bg-transparent border-none outline-none pl-4 py-3 text-sm text-slate-700 w-full font-bold">
                    <button class="bg-msc-blue text-white px-6 hover:bg-blue-700 transition-colors">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-8">
                <a href="#" class="flex flex-col items-center gap-1 text-msc-blue hover:scale-110 transition-transform group">
                    <i class="fa-solid fa-clipboard-list text-2xl text-msc-blue"></i>
                    <span class="text-[10px] font-black uppercase tracking-widest px-1">Quick Order</span>
                </a>

                <a href="#" class="flex flex-col items-center gap-1 text-msc-blue hover:scale-110 transition-transform group">
                    <i class="fa-regular fa-user text-2xl text-msc-blue"></i>
                    <span class="text-[10px] font-black uppercase tracking-widest px-1">Login / Register</span>
                </a>

                <button class="flex flex-col items-center gap-1 text-msc-blue hover:scale-110 transition-transform relative group">
                    <div class="relative">
                        <i class="fa-solid fa-cart-shopping text-2xl text-msc-blue"></i>
                        <span class="absolute -top-1.5 -right-2 w-5 h-5 bg-green-600 text-white text-[10px] font-black flex items-center justify-center rounded-full border-2 border-white shadow-sm">1</span>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-widest px-1">Cart</span>
                </button>
            </div>
        </div>
    </header>

    <!-- STANDARD VERSION -->
    <div class="divider px-8 mt-20 mb-8 uppercase font-black text-slate-400 text-xs tracking-widest text-center h-px bg-slate-200 flex items-center justify-center max-w-screen-2xl mx-auto"><span class="bg-slate-50 px-4">Standard Framework Version</span></div>

    <nav class="bg-white border-b border-gray-200 mt-10 mb-20 mx-auto max-w-screen-2xl font-sans shadow-sm">
      <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between h-20">
          <div class="flex items-center">
            <div class="flex-shrink-0 flex items-center">
              <img src="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg" alt="MSC Logo" class="h-10 w-auto">
            </div>
            <div class="hidden md:ml-10 md:flex md:space-x-8">
              <a href="#" class="border-msc-blue text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-bold"> Shop All Products </a>
              <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-bold"> Quick Order </a>
            </div>
          </div>
          <div class="hidden md:ml-6 md:flex md:items-center gap-6">
            <div class="flex-1 flex items-center justify-center lg:ml-6 lg:justify-end">
              <div class="max-w-lg w-full lg:max-w-xs">
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                  </div>
                  <input class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-msc-blue focus:border-msc-blue sm:text-sm" placeholder="Search by keyword..." type="search">
                </div>
              </div>
            </div>
            
            <button class="text-gray-400 hover:text-msc-blue transition-colors relative">
              <i class="fa-solid fa-cart-shopping text-2xl"></i>
              <span class="absolute -top-2 -right-2 bg-green-600 text-white text-[10px] rounded-full h-5 w-5 flex items-center justify-center font-bold">1</span>
            </button>

            <a href="#" class="text-gray-500 hover:text-msc-blue font-bold text-sm">Login</a>
            
            <div class="ml-3 relative">
                <button class="bg-white flex text-sm rounded-full focus:outline-none border-2 border-slate-100 p-2 hover:border-msc-blue transition-colors">
                  <i class="fa-regular fa-user text-xl text-gray-600"></i>
                </button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[9999]">
        <div class="bg-white/90 backdrop-blur-md border border-gray-200 rounded-full p-1 shadow-2xl flex items-center gap-2">
            <div class="flex bg-gray-100 rounded-full p-1 relative" id="frameworkToggle">
                <div id="toggleHighlight" class="absolute bg-msc-blue rounded-full transition-all duration-300 ease-out h-[calc(100%-8px)] top-1"></div>
                
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="daisyui.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">DaisyUI</span>
                </label>
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="flowbite.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Flowbite</span>
                </label>
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="untitled_ui.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">UntitledUI</span>
                </label>
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="tailwind_plus.html">
                    <input type="radio" name="framework" class="sr-only" checked>
                    <span class="text-white">Plus</span>
                </label>
            </div>
            
            <a href="index.html" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-msc-blue" title="Home">
                <i class="fa-solid fa-house text-lg"></i>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById('frameworkToggle');
            const highlight = document.getElementById('toggleHighlight');
            const labels = toggle.querySelectorAll('label');
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';

            function updateToggle(activeLabel) {
                if (!activeLabel) {
                    highlight.style.width = '0px';
                    return;
                }
                const rect = activeLabel.getBoundingClientRect();
                const containerRect = toggle.getBoundingClientRect();
                
                highlight.style.width = `${rect.width}px`;
                highlight.style.left = `${rect.left - containerRect.left}px`;

                labels.forEach(label => {
                    const span = label.querySelector('span');
                    if (label === activeLabel) {
                        span.classList.remove('text-gray-500');
                        span.classList.add('text-white');
                    } else {
                        span.classList.remove('text-white');
                        span.classList.add('text-gray-500');
                    }
                });
            }

            let found = false;
            labels.forEach(label => {
                const url = label.getAttribute('data-url');
                if (currentPage === url) {
                    label.querySelector('input').checked = true;
                    updateToggle(label);
                    found = true;
                }

                label.addEventListener('click', (e) => {
                    if (currentPage !== url) {
                        window.location.href = url;
                    }
                });
            });

            if(!found) highlight.style.width = '0px';

            window.addEventListener('resize', () => {
                const checked = toggle.querySelector('input:checked');
                if (checked) updateToggle(checked.parentElement);
            });
            
            setTimeout(() => {
                const checked = toggle.querySelector('input:checked');
                if (checked) updateToggle(checked.parentElement);
            }, 100);
        });
    </script>
</body>
</html>
