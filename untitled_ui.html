<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled UI - MSC Direct Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            600: '#1C58EE',
                        },
                        'msc-blue': '#1C58EE',
                        gray: {
                            25: '#FCFCFD',
                            50: '#F9FAFB',
                            100: '#F2F4F7',
                            200: '#EAECF0',
                            300: '#D0D5DD',
                            400: '#98A2B3',
                            500: '#667085',
                            600: '#475467',
                            700: '#344054',
                            800: '#1D2939',
                            900: '#101828',
                        }
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .untitled-shadow {
            box-shadow: 0px 1px 2px rgba(16, 24, 40, 0.05);
        }
        .msc-border-bottom { border-bottom: 3px solid #1C58EE; }
        .top-bar { background-color: #f8fafc; font-size: 13px; }
        header i.fa-solid:not(.fa-magnifying-glass), 
        header i.fa-regular { 
            color: #1C58EE !important; 
        }
    </style>
</head>
<body class="bg-white min-h-screen">

    <!-- Top Bar -->
    <div class="top-bar py-1 px-4 lg:px-8 border-b border-gray-100">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-gray-500 font-medium">
            <div class="flex gap-6">
                <a href="#" class="hover:text-msc-blue">Solutions</a>
                <a href="#" class="hover:text-msc-blue">Resources</a>
                <a href="#" class="hover:text-msc-blue">Special Offers</a>
                <a href="#" class="hover:text-msc-blue">Catalogs</a>
            </div>
            <div>
                Need help? Call us <span class="font-bold text-msc-blue">1-800-645-7270</span>
            </div>
        </div>
    </div>

    <header class="bg-white msc-border-bottom sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-24">
                <!-- Logo & Nav -->
                <div class="flex items-center gap-8">
                    <a href="#" class="flex items-center group">
                        <img src="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg" alt="MSC Direct" class="h-10">
                    </a>

                    <!-- Dropdown: Shop All Products -->
                    <div class="hidden lg:block relative group">
                        <button class="flex items-center gap-2 text-msc-blue font-bold py-2 whitespace-nowrap">
                            Shop All Products
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-hover:rotate-180 text-msc-blue"></i>
                        </button>
                    </div>
                </div>

                <!-- Search & Actions -->
                <div class="flex items-center gap-6 flex-1 max-w-4xl justify-end ml-8">
                    <div class="relative w-full hidden md:flex items-stretch group">
                        <input type="text" placeholder="Search by keyword or part number..." class="w-full bg-white border border-gray-300 rounded-l-lg py-2.5 pl-4 pr-4 untitled-shadow focus:ring-2 focus:ring-msc-blue/20 focus:border-msc-blue outline-none transition-all placeholder:text-gray-400 font-medium">
                        <button class="bg-msc-blue text-white px-5 rounded-r-lg hover:bg-blue-700 transition-colors">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-6 pl-4">
                        <!-- Quick Order -->
                        <a href="#" class="flex flex-col items-center gap-1 text-msc-blue hover:text-blue-800 transition-colors group">
                            <i class="fa-solid fa-clipboard-list text-xl text-msc-blue"></i>
                            <span class="text-[10px] font-bold uppercase tracking-tight">Quick Order</span>
                        </a>

                        <!-- Login/Register -->
                        <a href="#" class="flex flex-col items-center gap-1 text-msc-blue hover:text-blue-800 transition-colors group">
                            <i class="fa-regular fa-user text-xl text-msc-blue"></i>
                            <span class="text-[10px] font-bold uppercase tracking-tight whitespace-nowrap">Login / Register</span>
                        </a>
                        
                        <!-- Cart -->
                        <button class="flex flex-col items-center gap-1 text-msc-blue hover:text-blue-800 transition-colors relative">
                            <div class="relative">
                                <i class="fa-solid fa-cart-shopping text-xl text-msc-blue"></i>
                                <span class="absolute -top-1 -right-1.5 bg-green-600 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full">1</span>
                            </div>
                            <span class="text-[10px] font-bold uppercase tracking-tight">Cart</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- STANDARD VERSION -->
    <div class="divider px-8 mt-20 mb-8 uppercase font-black text-slate-400 text-xs tracking-widest text-center h-px bg-slate-200 flex items-center justify-center max-w-7xl mx-auto"><span class="bg-white px-4">Standard Framework Version</span></div>

    <header class="bg-white border border-gray-200 mt-10 mb-20 mx-auto max-w-7xl rounded-2xl shadow-sm overflow-hidden font-sans">
        <div class="px-6">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-10">
                    <a href="#" class="flex-shrink-0">
                        <img src="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg" class="h-8 w-auto" alt="Logo">
                    </a>
                    <nav class="hidden md:flex space-x-6">
                        <div class="relative group">
                            <button class="text-gray-600 hover:text-gray-900 font-semibold flex items-center gap-1">
                                Shop All Products
                                <i class="fa-solid fa-chevron-down text-[10px]"></i>
                            </button>
                        </div>
                        <a href="#" class="text-gray-600 hover:text-gray-900 font-semibold">Quick Order</a>
                    </nav>
                </div>
                <div class="flex items-center gap-6">
                    <div class="relative hidden lg:block">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                        </div>
                        <input type="text" class="block w-64 pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-msc-blue/20 focus:border-msc-blue sm:text-sm" placeholder="Search by keyword...">
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <a href="#" class="text-gray-600 hover:text-gray-900 font-semibold text-sm">Login</a>
                        <button class="relative p-2 text-gray-600 hover:text-msc-blue transition-colors">
                            <i class="fa-solid fa-cart-shopping text-xl"></i>
                            <span class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-[10px] font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-green-600 rounded-full">1</span>
                        </button>
                        <a href="#" class="hidden sm:inline-flex items-center px-4 py-2 border border-transparent text-sm font-bold rounded-lg text-white bg-msc-blue hover:bg-blue-700 transition-all">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[9999]">
        <div class="bg-white/90 backdrop-blur-md border border-gray-200 rounded-full p-1 shadow-2xl flex items-center gap-2">
            <div class="flex bg-gray-100 rounded-full p-1 relative" id="frameworkToggle">
                <div id="toggleHighlight" class="absolute bg-msc-blue rounded-full transition-all duration-300 ease-out h-[calc(100%-8px)] top-1"></div>
                
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="daisyui.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">DaisyUI</span>
                </label>
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="flowbite.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Flowbite</span>
                </label>
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="untitled_ui.html">
                    <input type="radio" name="framework" class="sr-only" checked>
                    <span class="text-white">UntitledUI</span>
                </label>
                <label class="relative z-10 cursor-pointer px-4 py-2 text-xs font-bold transition-colors uppercase tracking-tight" data-url="tailwind_plus.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Plus</span>
                </label>
            </div>
            
            <a href="index.html" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-msc-blue" title="Home">
                <i class="fa-solid fa-house text-lg"></i>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById('frameworkToggle');
            const highlight = document.getElementById('toggleHighlight');
            const labels = toggle.querySelectorAll('label');
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';

            function updateToggle(activeLabel) {
                if (!activeLabel) {
                    highlight.style.width = '0px';
                    return;
                }
                const rect = activeLabel.getBoundingClientRect();
                const containerRect = toggle.getBoundingClientRect();
                
                highlight.style.width = `${rect.width}px`;
                highlight.style.left = `${rect.left - containerRect.left}px`;

                labels.forEach(label => {
                    const span = label.querySelector('span');
                    if (label === activeLabel) {
                        span.classList.remove('text-gray-500');
                        span.classList.add('text-white');
                    } else {
                        span.classList.remove('text-white');
                        span.classList.add('text-gray-500');
                    }
                });
            }

            let found = false;
            labels.forEach(label => {
                const url = label.getAttribute('data-url');
                if (currentPage === url) {
                    label.querySelector('input').checked = true;
                    updateToggle(label);
                    found = true;
                }

                label.addEventListener('click', (e) => {
                    if (currentPage !== url) {
                        window.location.href = url;
                    }
                });
            });

            if(!found) highlight.style.width = '0px';

            window.addEventListener('resize', () => {
                const checked = toggle.querySelector('input:checked');
                if (checked) updateToggle(checked.parentElement);
            });
            
            setTimeout(() => {
                const checked = toggle.querySelector('input:checked');
                if (checked) updateToggle(checked.parentElement);
            }, 100);
        });
    </script>
</body>
</html>
