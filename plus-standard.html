<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg">
    <title>Tailwind Plus - Standard Framework Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'] },
                    colors: { 'msc-blue': '#1C58EE' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-white border border-gray-200 mt-8 mb-20 mx-auto max-w-[95%] md:max-w-screen-2xl font-sans rounded-xl md:rounded-2xl shadow-sm overflow-hidden">
      <div class="max-w-7xl mx-auto px-4 md:px-6">
        <div class="flex justify-between items-center h-16 md:h-20">
          <div class="flex items-center gap-4 md:gap-10">
            <div class="flex-shrink-0 flex items-center"><img src="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg" alt="MSC Logo" class="h-6 md:h-10 w-auto"></div>
            <div class="hidden md:flex md:space-x-8">
              <a href="#" class="border-msc-blue text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-bold"> Shop Products </a>
              <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-bold"> Quick Order </a>
            </div>
          </div>
          <div class="flex items-center gap-3 md:gap-6">
            <div class="hidden sm:flex items-center justify-center">
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i></div>
                <input class="block w-40 md:w-64 pl-10 pr-3 py-1.5 border border-gray-200 rounded-lg text-sm bg-gray-50 focus:outline-none focus:ring-1 focus:ring-msc-blue focus:border-msc-blue" placeholder="Search..." type="search">
              </div>
            </div>
            <div class="flex items-center gap-3 md:gap-4">
                <button class="text-gray-400 hover:text-msc-blue transition-colors relative">
                  <i class="fa-solid fa-cart-shopping text-xl md:text-2xl"></i>
                  <span class="absolute -top-1.5 -right-1.5 bg-green-600 text-white text-[9px] rounded-full h-4 w-4 flex items-center justify-center font-bold">1</span>
                </button>
                <a href="#" class="text-gray-500 hover:text-msc-blue font-bold text-[13px] md:text-sm">Login</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 py-12 text-center">
        <h1 class="text-3xl font-black text-slate-800">Standard Tailwind Header</h1>
        <p class="text-slate-500 mb-12">Pure framework implementation using Tailwind-standard patterns</p>

        <div class="px-4 md:px-6 mb-20">
            <div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden font-sans text-left">
                <img src="eprocurement.png" alt="eProcurement" class="w-full h-48 md:h-72 object-cover">
                <div class="p-6 md:p-8 flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-0">
                    <h3 class="text-xl md:text-2xl font-black text-gray-900 uppercase tracking-tighter">eProcurement</h3>
                    <a href="#" class="w-full sm:w-auto inline-flex justify-center items-center px-10 py-3 border-2 border-msc-blue text-xs font-black rounded-full text-msc-blue hover:bg-msc-blue hover:text-white transition-all uppercase tracking-widest">Learn More</a>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING MENU  -->
    <div class="fixed bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 z-[9999] w-[95%] max-w-max">
        <div class="bg-white/90 backdrop-blur-md border border-gray-200 rounded-full p-1 shadow-2xl flex items-center gap-1 md:gap-2">
            <div class="flex bg-gray-100 rounded-full p-0.5 md:p-1 relative overflow-hidden" id="frameworkToggle">
                <div id="toggleHighlight" class="absolute bg-msc-blue rounded-full transition-all duration-300 ease-out h-[calc(100%-4px)] md:h-[calc(100%-8px)] top-0.5 md:top-1"></div>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="daisyui-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Daisy</span>
                </label>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="flowbite-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Flowbite</span>
                </label>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="untitled-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Untitled</span>
                </label>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="plus-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Plus</span>
                </label>
            </div>

            <div class="h-6 w-px bg-gray-200 mx-1"></div>

            <div class="flex gap-1">
                <a href="plus-custom.html" class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest text-slate-500 hover:bg-gray-100 transition-all">Custom</a>
                <a href="plus-standard.html" class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-msc-blue text-white shadow-sm transition-all">Standard</a>
            </div>

            <div class="h-6 w-px bg-gray-200 mx-1"></div>
            
            <a href="index.html" class="p-1.5 md:p-2 hover:bg-gray-100 rounded-full transition-colors text-msc-blue" title="Home"><i class="fa-solid fa-house text-base md:text-lg"></i></a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById('frameworkToggle');
            const highlight = document.getElementById('toggleHighlight');
            const labels = toggle.querySelectorAll('label');
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';

            function updateToggle(activeLabel) {
                if (!activeLabel) { highlight.style.width = '0px'; return; }
                const rect = activeLabel.getBoundingClientRect();
                const containerRect = toggle.getBoundingClientRect();
                highlight.style.width = `${rect.width}px`;
                highlight.style.left = `${rect.left - containerRect.left}px`;
                labels.forEach(label => {
                    const span = label.querySelector('span');
                    if (label === activeLabel) { span.classList.remove('text-gray-500'); span.classList.add('text-white'); }
                    else { span.classList.remove('text-white'); span.classList.add('text-gray-500'); }
                });
            }

            labels.forEach(label => {
                const url = label.getAttribute('data-url');
                const frameworkKey = url.split('-')[0];
                if (currentPage.includes(frameworkKey)) {
                    label.querySelector("input").checked = true;
                    updateToggle(label);
                }
                label.addEventListener('click', () => window.location.href = url);
            });
            setTimeout(() => { const checked = toggle.querySelector('input:checked'); if (checked) updateToggle(checked.parentElement); }, 100);
        });
    </script>
</body>
</html>
