<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg">
    <title>Untitled UI - Custom MSC Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            600: '#1C58EE',
                        },
                        'msc-blue': '#1C58EE',
                        gray: {
                            25: '#FCFCFD',
                            50: '#F9FAFB',
                            100: '#F2F4F7',
                            200: '#EAECF0',
                            300: '#D0D5DD',
                            400: '#98A2B3',
                            500: '#667085',
                            600: '#475467',
                            700: '#344054',
                            800: '#1D2939',
                            900: '#101828',
                        }
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .untitled-shadow {
            box-shadow: 0px 1px 2px rgba(16, 24, 40, 0.05);
        }
        .msc-border-bottom { border-bottom: 3px solid #1C58EE; }
        .top-bar { background-color: #f8fafc; font-size: 13px; }
        header i.fa-solid:not(.fa-magnifying-glass), 
        header i.fa-regular { 
            color: #1C58EE !important; 
        }
    </style>
</head>
<body class="bg-white min-h-screen">

    <!-- Top Bar -->
    <div class="top-bar py-1 px-4 lg:px-8 border-b border-gray-100">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-gray-500 font-medium gap-2 sm:gap-0">
            <div class="hidden sm:flex gap-6 text-xs md:text-[13px]">
                <a href="#" class="hover:text-msc-blue">Solutions</a>
                <a href="#" class="hover:text-msc-blue">Resources</a>
                <a href="#" class="hover:text-msc-blue">Special Offers</a>
                <a href="#" class="hover:text-msc-blue">Catalogs</a>
            </div>
            <div class="text-[11px] md:text-[13px]">
                Need help? Call us <span class="font-bold text-msc-blue">1-800-645-7270</span>
            </div>
        </div>
    </div>

    <header class="bg-white msc-border-bottom sticky top-0 z-50 shadow-sm md:shadow-none">
        <div class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20 md:h-24">
                <!-- Mobile Menu Button -->
                <div class="flex md:hidden items-center mr-2">
                    <button id="mobileMenuBtn" class="text-msc-blue p-2">
                        <i class="fa-solid fa-bars-staggered text-2xl"></i>
                    </button>
                </div>

                <!-- Logo & Nav -->
                <div class="flex items-center gap-4 md:gap-8">
                    <a href="#" class="flex items-center group">
                        <img src="https://cdn.mscdirect.com/global/v2/img/header/msc-logo.svg" alt="MSC Direct" class="h-8 md:h-10">
                    </a>

                    <!-- Dropdown: Shop All Products -->
                    <div class="hidden lg:block relative group px-2">
                        <button class="flex items-center gap-2 text-msc-blue font-bold py-2 whitespace-nowrap text-sm">
                            Shop All Products
                            <i class="fa-solid fa-chevron-down text-[10px] transition-transform group-hover:rotate-180 text-msc-blue"></i>
                        </button>
                    </div>
                </div>

                <!-- Search & Actions -->
                <div class="flex items-center gap-3 md:gap-6 flex-1 max-w-4xl justify-end ml-2 md:ml-8">
                    <div class="relative w-full hidden md:flex items-stretch group">
                        <input type="text" placeholder="Search by keyword or part number..." class="w-full bg-white border border-gray-300 rounded-l-lg py-2 pl-4 pr-4 untitled-shadow focus:ring-2 focus:ring-msc-blue/20 focus:border-msc-blue outline-none transition-all placeholder:text-gray-400 font-medium text-sm">
                        <button class="bg-msc-blue text-white px-5 rounded-r-lg hover:bg-blue-700 transition-colors">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-4 md:gap-6 md:pl-4">
                        <a href="#" class="flex flex-col items-center gap-1 text-msc-blue hover:text-blue-800 transition-colors group">
                            <i class="fa-regular fa-user text-xl text-msc-blue"></i>
                            <span class="text-[9px] md:text-[10px] font-bold uppercase tracking-tight whitespace-nowrap">Login</span>
                        </a>
                        
                        <button class="flex flex-col items-center gap-1 text-msc-blue hover:text-blue-800 transition-colors relative">
                            <div class="relative">
                                <i class="fa-solid fa-cart-shopping text-xl text-msc-blue"></i>
                                <span class="absolute -top-1 -right-1.5 bg-green-600 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full">1</span>
                            </div>
                            <span class="text-[9px] md:text-[10px] font-bold uppercase tracking-tight">Cart</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 text-center">
        <h1 class="text-3xl font-black text-slate-800">Custom Untitled UI Implementation</h1>
        <p class="text-slate-500 mb-12">Premium minimalist design with Untitled UI style and MSC brand assets</p>

        <!-- eProcurement Showcase -->
        <div class="px-4 md:px-6 mb-20">
            <div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden font-sans text-left">
                <img src="eprocurement.png" alt="eProcurement" class="w-full h-48 md:h-72 object-cover">
                <div class="p-6 md:p-8 flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-0">
                    <h3 class="text-xl md:text-2xl font-bold text-gray-900">eProcurement</h3>
                    <a href="#" class="w-full sm:w-auto inline-flex justify-center items-center px-8 py-2.5 border border-msc-blue text-sm font-bold rounded-full text-msc-blue hover:bg-blue-50 transition-all">
                        Learn More
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING MENU  -->
    <div class="fixed bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 z-[9999] w-[95%] max-w-max">
        <div class="bg-white/90 backdrop-blur-md border border-gray-200 rounded-full p-1 shadow-2xl flex items-center gap-1 md:gap-2">
            <div class="flex bg-gray-100 rounded-full p-0.5 md:p-1 relative overflow-hidden" id="frameworkToggle">
                <div id="toggleHighlight" class="absolute bg-msc-blue rounded-full transition-all duration-300 ease-out h-[calc(100%-4px)] md:h-[calc(100%-8px)] top-0.5 md:top-1"></div>
                
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="daisyui-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Daisy</span>
                </label>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="flowbite-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Flowbite</span>
                </label>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="untitled-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Untitled</span>
                </label>
                <label class="relative z-10 cursor-pointer px-2 md:px-4 py-1.5 md:py-2 text-[9px] md:text-xs font-bold transition-colors uppercase tracking-tight" data-url="plus-custom.html">
                    <input type="radio" name="framework" class="sr-only">
                    <span class="text-gray-500">Plus</span>
                </label>
            </div>

            <div class="h-6 w-px bg-gray-200 mx-1"></div>

            <div class="flex gap-1">
                <a href="untitled-custom.html" class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-msc-blue text-white shadow-sm transition-all">Custom</a>
                <a href="untitled-standard.html" class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest text-slate-500 hover:bg-gray-100 transition-all">Standard</a>
            </div>

            <div class="h-6 w-px bg-gray-200 mx-1"></div>
            
            <a href="index.html" class="p-1.5 md:p-2 hover:bg-gray-100 rounded-full transition-colors text-msc-blue" title="Home">
                <i class="fa-solid fa-house text-base md:text-lg"></i>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById('frameworkToggle');
            const highlight = document.getElementById('toggleHighlight');
            const labels = toggle.querySelectorAll('label');
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';

            function updateToggle(activeLabel) {
                if (!activeLabel) {
                    highlight.style.width = '0px';
                    return;
                }
                const rect = activeLabel.getBoundingClientRect();
                const containerRect = toggle.getBoundingClientRect();
                
                highlight.style.width = `${rect.width}px`;
                highlight.style.left = `${rect.left - containerRect.left}px`;

                labels.forEach(label => {
                    const span = label.querySelector('span');
                    if (label === activeLabel) {
                        span.classList.remove('text-gray-500');
                        span.classList.add('text-white');
                    } else {
                        span.classList.remove('text-white');
                        span.classList.add('text-gray-500');
                    }
                });
            }

            labels.forEach(label => {
                const url = label.getAttribute('data-url');
                const frameworkKey = url.split('-')[0];
                if (currentPage.includes(frameworkKey)) {
                    label.querySelector("input").checked = true;
                    updateToggle(label);
                }
                label.addEventListener('click', () => window.location.href = url);
            });
            
            setTimeout(() => {
                const checked = toggle.querySelector('input:checked');
                if (checked) updateToggle(checked.parentElement);
            }, 100);
        });
    </script>
</body>
</html>
